<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      tailwind = { config: { corePlugins: { preflight: false } } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans%3Awght%40200..800&display=swap"
      rel="stylesheet"
    />
    <style>
      *, ::before, ::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div
      data-pencil-name="Dialog ganti link · Desktop"
      class="box-border w-[1440px] h-[1024px] flex flex-col gap-0 justify-center items-center bg-[#09090B80] overflow-hidden"
    >
      <div
        data-pencil-name="Dialog"
        class="box-border w-[560px] h-fit shrink-0 [box-shadow:0px_16px_40px_#18181B24] flex flex-col gap-0 justify-start items-start bg-[#FFFFFF] [border:1px_solid_#F0F0F2] rounded-[16px] overflow-hidden"
      >
        <div
          data-pencil-name="Header"
          class="[box-sizing:content-box] w-[560px] h-[86.5px] shrink-0 flex flex-row gap-[12px] p-[20px_24px] justify-start items-start [border-width:0px_0px_1px_0px] [border-style:solid] [border-color:#F0F0F2] [margin:0px_0px_-0.5px_0px]"
        >
          <div
            data-pencil-name="Heading"
            class="box-border [flex:1_1_0] h-fit flex flex-col gap-[4px] justify-start items-start"
          >
            <div
              data-pencil-name="Title"
              class="text-[18px]/[normal] box-border text-[#18181B] font-['Plus_Jakarta_Sans',system-ui,sans-serif] font-bold tracking-[-0.4px] text-left [white-space:nowrap]"
            >
              Ganti link galeri?
            </div>
            <div
              data-pencil-name="Description"
              class="text-[13px]/[20px] box-border w-full text-[#52525B] font-['Plus_Jakarta_Sans',system-ui,sans-serif] font-normal text-left"
            >
              Link lama berhenti bekerja.
            </div>
          </div>
          <div
            data-pencil-name="Close"
            class="box-border w-fit shrink-0 h-fit flex flex-row gap-0 p-[8px] justify-center items-center rounded-[8px]"
          >
            <svg
              data-pencil-name="Icon"
              data-icon-name="x"
              data-icon-set="lucide"
              viewBox="0 0 13.99993896484375 14"
              preserveAspectRatio="xMidYMid meet"
              xmlns="http://www.w3.org/2000/svg"
              class="box-border w-[16px] shrink-0 h-[16px]"
            >
              <path
                d="M3.34619 2.93945q-0.25293 0.08545-0.37939 0.30762-0.04102 0.08545-0.04102 0.25293 0 0.16748 0.04102 0.25293 0.04443 0.08203 1.62353 1.66455l1.58252 1.58252-1.58252 1.58252q-1.5791 1.58252-1.62353 1.66797-0.04102 0.08203-0.04102 0.23584 0 0.15381 0.03418 0.23926 0.0376 0.08203 0.1333 0.18115 0.09912 0.0957 0.18115 0.1333 0.08545 0.03418 0.23926 0.03418 0.15381 0 0.23584-0.04102 0.08545-0.04443 1.66797-1.62353l1.58252-1.58252 1.58252 1.58252q1.58252 1.5791 1.66455 1.62353 0.08545 0.04102 0.23926 0.04102 0.15381 0 0.23584-0.03418 0.08545-0.0376 0.18115-0.1333 0.09912-0.09912 0.1333-0.18115 0.0376-0.08545 0.0376-0.23926 0-0.15381-0.04443-0.23584-0.04101-0.08545-1.62012-1.66797l-1.58252-1.58252 1.58252-1.58252q1.5791-1.58252 1.62012-1.66455 0.04443-0.08545 0.04443-0.25293 0-0.16748-0.04102-0.25293-0.09912-0.16748-0.28027-0.2666-0.05811-0.02734-0.09912-0.04102-0.04102-0.01367-0.15381-0.01367-0.11279 0-0.15381 0.01367-0.04101 0.01367-0.11279 0.04102-0.09912 0.05811-1.66455 1.62695l-1.56885 1.56543-2.82666-2.81299q-0.31104-0.29395-0.42041-0.37939-0.08545-0.05469-0.19824-0.05469l-0.02735 0q-0.14014 0-0.18115 0.01367z"
                fill="#18181B"
              ></path>
            </svg>
          </div>
        </div>
        <div
          data-pencil-name="Body"
          class="box-border w-full h-fit shrink-0 flex flex-col gap-[16px] p-[24px] justify-start items-start"
        >
          <div
            data-pencil-name="Body text"
            class="text-[14px]/[21px] box-border w-full text-[#52525B] font-['Plus_Jakarta_Sans',system-ui,sans-serif] font-normal text-left"
          >
            Semua link yang sudah Anda bagikan, termasuk link invoice, tidak bisa dibuka lagi.
            Password tidak berubah. Bagikan link baru ke klien.
          </div>
        </div>
        <div
          data-pencil-name="Footer"
          class="[box-sizing:content-box] w-[560px] h-[73.5px] shrink-0 flex flex-row gap-[12px] p-[16px_24px] justify-end items-center bg-[#F4F4F5] [border-width:1px_0px_0px_0px] [border-style:solid] [border-color:#F0F0F2] [margin:-0.5px_0px_0px_0px]"
        >
          <div
            data-pencil-name="Actions"
            class="box-border w-fit shrink-0 h-fit flex flex-row gap-[12px] justify-start items-center"
          >
            <div
              data-pencil-name="Cancel"
              class="box-border w-fit shrink-0 h-fit flex flex-row gap-[8px] p-[12px_36px] justify-center items-center bg-[#FFFFFF] [border:1px_solid_#F0F0F2] rounded-[999px]"
            >
              <div
                data-pencil-name="Label"
                class="text-[14px]/[normal] box-border text-[#18181B] font-['Plus_Jakarta_Sans',system-ui,sans-serif] font-semibold text-left [white-space:nowrap]"
              >
                Batal
              </div>
            </div>
            <div
              data-pencil-name="Confirm"
              class="box-border w-fit shrink-0 h-fit flex flex-row gap-[8px] p-[12px_36px] justify-center items-center bg-[#DC2626] rounded-[999px]"
            >
              <div
                data-pencil-name="Label"
                class="text-[14px]/[normal] box-border text-[#FFFFFF] font-['Plus_Jakarta_Sans',system-ui,sans-serif] font-semibold text-left [white-space:nowrap]"
              >
                Ganti link
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
