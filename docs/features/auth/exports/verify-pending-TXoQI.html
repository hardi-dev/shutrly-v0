<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      tailwind = { config: { corePlugins: { preflight: false } } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans%3Awght%40200..800&display=swap"
      rel="stylesheet"
    />
    <style>
      *, ::before, ::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }
    </style>
  </head>
  <body style="background-color: #FFFFFF">
    <div
      data-pencil-name="Auth / Verification pending / Mobile"
      class="box-border w-[390px] h-[844px] flex flex-row gap-0 justify-start items-start bg-[#FFFFFF] overflow-hidden"
    >
      <div
        data-pencil-name="Form side"
        class="box-border [flex:1_1_0] h-full flex flex-col gap-0 p-[24px] justify-start items-start bg-[#FFFFFF]"
      >
        <div
          data-pencil-name="Brand"
          class="box-border w-fit h-fit shrink-0 flex flex-row gap-[8px] justify-start items-center"
        >
          <div
            data-pencil-name="Lime mark"
            class="box-border w-[16px] shrink-0 h-[16px] flex flex-row gap-0 justify-start items-start bg-[#C6F432] rounded-[4px]"
          ></div>
          <div
            data-pencil-name="Wordmark"
            class="text-[18px]/[normal] box-border text-[#18181B] font-['Plus_Jakarta_Sans',system-ui,sans-serif] font-bold text-left [white-space:nowrap]"
          >
            shutrly.
          </div>
        </div>
        <div
          data-pencil-name="Form positioning"
          class="box-border w-full [flex:1_1_0] flex flex-col gap-0 justify-center items-center"
        >
          <div
            data-pencil-name="Login form"
            class="box-border w-full h-fit shrink-0 flex flex-col gap-[24px] justify-start items-start"
          >
            <div
              data-pencil-name="Intro"
              class="box-border w-full h-fit shrink-0 flex flex-col gap-[8px] justify-start items-start"
            >
              <div
                data-pencil-name="Title"
                class="text-[34px]/[normal] box-border text-[#18181B] font-['Plus_Jakarta_Sans',system-ui,sans-serif] font-bold tracking-[-1px] text-left [white-space:nowrap]"
              >
                Check your email
              </div>
              <div
                data-pencil-name="Subtitle"
                class="text-[14px]/[21px] box-border w-full text-[#52525B] font-['Plus_Jakarta_Sans',system-ui,sans-serif] font-normal text-left"
              >
                If this address needs verification, a link is on its way. Open it to continue.
              </div>
            </div>
            <div
              data-pencil-name="Verification instructions"
              class="box-border w-full h-fit shrink-0 flex flex-row gap-[12px] p-[12px] justify-start items-start bg-[#EEF3FF] [border:1px_solid_#1D4ED840] rounded-[12px]"
            >

              </svg>
              <div
                data-pencil-name="Text"
                class="box-border [flex:1_1_0] h-fit flex flex-col gap-[2px] justify-start items-start"
              >
                <div
                  data-pencil-name="Title"
                  class="text-[13px]/[18px] box-border w-full text-[#1D4ED8] font-['Plus_Jakarta_Sans',system-ui,sans-serif] font-semibold text-left"
                >
                  The link expires in 24 hours
                </div>
                <div
                  data-pencil-name="Body"
                  class="text-[12px]/[17px] box-border w-full text-[#52525B] font-['Plus_Jakarta_Sans',system-ui,sans-serif] font-normal text-left"
                >
                  Check your spam folder if it does not arrive.
                </div>
              </div>
            </div>
            <div
              data-pencil-name="Resend verification button"
              class="box-border w-full h-fit shrink-0 flex flex-row gap-[8px] p-[12px_36px] justify-center items-center bg-[#2F5BFF] rounded-[999px]"
            >
              <div
                data-pencil-name="Label"
                class="text-[14px]/[normal] box-border text-[#FFFFFF] font-['Plus_Jakarta_Sans',system-ui,sans-serif] font-semibold text-left [white-space:nowrap]"
              >
                Resend verification email
              </div>
            </div>
            <div
              data-pencil-name="Cooldown note"
              class="text-[12px]/[18px] box-border w-full text-[#71717A] font-['Plus_Jakarta_Sans',system-ui,sans-serif] font-normal text-left"
            >
              You can request another email in 60 seconds.
            </div>
            <div
              data-pencil-name="Return to sign in link"
              class="text-[13px]/[20px] box-border w-full text-[#1D4ED8] font-['Plus_Jakarta_Sans',system-ui,sans-serif] font-normal text-left"
            >
              Back to sign in
            </div>
          </div>
        </div>
        <div
          data-pencil-name="Footer copyright"
          class="text-[12px]/[normal] box-border text-[#71717A] font-['Plus_Jakarta_Sans',system-ui,sans-serif] font-normal text-left [white-space:nowrap]"
        >
          © 2026 Shutrly
        </div>
      </div>
    </div>
  </body>
</html>
